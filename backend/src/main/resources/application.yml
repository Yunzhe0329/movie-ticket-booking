spring:
  application:
    name: movie-ticket-booking

  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:ticket}
    username: ${DB_USER:ticket}
    password: ${DB_PASSWORD:ticket}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    locations: classpath:db/migration