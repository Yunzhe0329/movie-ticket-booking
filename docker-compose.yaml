services:
  postgres:
    image: postgres:17
    container_name: ticket-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-ticket}
      POSTGRES_USER: ${DB_USER:-ticket}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ticket}
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data: